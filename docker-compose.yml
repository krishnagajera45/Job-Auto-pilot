version: "3.9"

services:
  api-gateway:
    build:
      context: ./services
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      RESUME_SERVICE_URL: http://resume-service:8002
      JOB_INGESTION_SERVICE_URL: http://job-ingestion-service:8003
      AGENT_SERVICE_URL: http://agent-orchestration-service:8004
      RAG_SERVICE_URL: http://rag-memory-service:8005
      AUTOMATION_SERVICE_URL: http://application-automation-service:8006
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8007
      ANALYTICS_SERVICE_URL: http://analytics-service:8008
    depends_on:
      - auth-service
      - resume-service
      - job-ingestion-service
      - agent-orchestration-service
      - rag-memory-service
      - application-automation-service
      - notifications-service
      - analytics-service

  auth-service:
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      # Do not use the default in production environments.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

  resume-service:
    build:
      context: ./services
      dockerfile: resume-service/Dockerfile
    ports:
      - "8002:8002"

  job-ingestion-service:
    build:
      context: ./services
      dockerfile: job-ingestion-service/Dockerfile
    ports:
      - "8003:8003"

  agent-orchestration-service:
    build:
      context: ./services
      dockerfile: agent-orchestration-service/Dockerfile
    ports:
      - "8004:8004"

  rag-memory-service:
    build:
      context: ./services
      dockerfile: rag-memory-service/Dockerfile
    ports:
      - "8005:8005"

  application-automation-service:
    build:
      context: ./services
      dockerfile: application-automation-service/Dockerfile
    ports:
      - "8006:8006"

  notifications-service:
    build:
      context: ./services
      dockerfile: notifications-service/Dockerfile
    ports:
      - "8007:8007"

  analytics-service:
    build:
      context: ./services
      dockerfile: analytics-service/Dockerfile
    ports:
      - "8008:8008"

  postgres:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobautopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobautopilot}
      POSTGRES_DB: ${POSTGRES_DB:-jobautopilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["infra"]
    ports:
      - "5672:5672"
      - "15672:15672"

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["infra"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    profiles: ["infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
